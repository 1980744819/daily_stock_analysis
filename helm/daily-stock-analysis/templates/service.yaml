{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "daily-stock-analysis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daily-stock-analysis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "daily-stock-analysis.fullname" . }}-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
{{- end }}
