{{- if .Values.server.enabled }}
{{- include "daily-stock-analysis.validateSecretConfig" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daily-stock-analysis.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daily-stock-analysis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: {{ include "daily-stock-analysis.fullname" . }}-server
  template:
    metadata:
      labels:
        app: {{ include "daily-stock-analysis.fullname" . }}-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ .Values.server.command | toJson }}
          ports:
            - containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "daily-stock-analysis.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secret.name }}
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: logs-volume
              mountPath: /app/logs
            - name: reports-volume
              mountPath: /app/reports
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "daily-stock-analysis.fullname" . }}-data
        - name: logs-volume
          persistentVolumeClaim:
            claimName: {{ include "daily-stock-analysis.fullname" . }}-logs
        - name: reports-volume
          persistentVolumeClaim:
            claimName: {{ include "daily-stock-analysis.fullname" . }}-reports
{{- end }}
